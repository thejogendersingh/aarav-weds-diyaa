<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- First Intertwined Ring -->
  <circle cx="25" cy="38" r="17" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Second Intertwined Ring -->
  <circle cx="39" cy="34" r="17" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Diamond on Ring -->
  <g transform="translate(39, 15)" filter="url(#glow)">
    <polygon points="0,-8 6,-1 0,6 -6,-1" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <polygon points="0,-6 4,-1 0,4 -4,-1" fill="#EAF6FF"/>
  </g>
</svg>
